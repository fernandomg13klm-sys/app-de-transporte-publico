<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a41">
  <title>MueveT · Transporte público</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🚌 MueveT</div>
    <div class="wallet-chip" id="walletChip" title="Saldo">$0.00</div>
  </header>

  <div id="map"></div>

  <main class="panel" id="panel">
    <!-- CAMIONES -->
    <section class="view active" id="view-bus">
      <label class="field">Ruta
        <select id="routeSelect"></select>
      </label>
      <div class="route-info" id="routeInfo"></div>
      <label class="field">Tu parada
        <select id="stopSelect"></select>
      </label>
      <div class="card highlight" id="nextBus"></div>
      <h3>Tiempo de parada en parada</h3>
      <ol class="stops" id="stopList"></ol>
      <button class="btn primary" id="payBusBtn">Pagar pasaje</button>
    </section>

    <!-- TAXIS -->
    <section class="view" id="view-taxi">
      <p class="muted">Taxis de calle registrados cerca de ti. El chofer no necesita app: solo su gafete con QR.</p>
      <label class="field">¿A dónde vas?
        <select id="destSelect"></select>
      </label>
      <div class="card" id="taxiQuote"></div>
      <ul class="taxis" id="taxiList"></ul>
    </section>

    <!-- CARTERA -->
    <section class="view" id="view-wallet">
      <div class="card balance">
        <div class="muted">Saldo disponible</div>
        <div class="big" id="balanceBig">$0.00</div>
      </div>
      <h3>Recargar</h3>
      <div class="chips">
        <button class="chip" data-topup="50">+$50</button>
        <button class="chip" data-topup="100">+$100</button>
        <button class="chip" data-topup="200">+$200</button>
      </div>
      <h3>Movimientos</h3>
      <ul class="history" id="history"></ul>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-view="bus">🚌<span>Camiones</span></button>
    <button class="tab" data-view="taxi">🚕<span>Taxis</span></button>
    <button class="tab" data-view="wallet">💳<span>Cartera</span></button>
  </nav>

  <dialog id="modal">
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
